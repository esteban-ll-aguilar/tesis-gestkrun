services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: gestkrun
      POSTGRES_USER: gestkrun
      POSTGRES_PASSWORD: gestkrun_dev
    ports:
      - "15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gestkrun"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "16379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgbouncer:
    image: edoburu/pgbouncer:latest
    environment:
      DB_USER: gestkrun
      DB_PASSWORD: gestkrun_dev
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: gestkrun
      POOL_MODE: transaction
      MAX_CLIENT_CONN: "100"
      DEFAULT_POOL_SIZE: "20"
    ports:
      - "16432:6432"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: ../tesis-gestkrun-api
      dockerfile: ../docker/Dockerfile.api
    ports:
      - "18000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://gestkrun:gestkrun_dev@postgres:5432/gestkrun
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: dev-secret-key-change-in-production
      ENVIRONMENT: development
    volumes:
      - ../tesis-gestkrun-api:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
    expose:
      - "80"
    environment:
      VITE_API_URL: http://localhost:18000
    depends_on:
      - api

  nginx:
    image: nginx:alpine
    ports:
      - "18080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - api
      - web

volumes:
  postgres_data:
  redis_data:
