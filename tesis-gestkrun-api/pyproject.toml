[tool.poetry]
name = "tesis-gestkrun-api"
version = "0.1.0"
description = "GESTKRUN Backend API"
authors = ["Esteban León Aguilar"]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.115"
uvicorn = {extras = ["standard"], version = "^0.34"}
sqlalchemy = "^2.0"
asyncpg = "^0.30"
alembic = "^1.14"
pydantic = "^2.10"
pydantic-settings = "^2.7"
python-jose = {extras = ["cryptography"], version = "^3.3"}
passlib = "^1.7"
bcrypt = "^4.0"
argon2-cffi = "^23.1"
structlog = "^25.1"
redis = "^5.2"
celery = "^5.4"
httpx = "^0.28"
python-multipart = "^0.0.18"
slowapi = "^0.1"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
pytest-asyncio = "^0.25"
pytest-cov = "^6.0"
ruff = "^0.9"
httpx = "^0.28"
testcontainers = {extras = ["postgres"], version = "^4.9"}

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"app/api/**/*.py" = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
