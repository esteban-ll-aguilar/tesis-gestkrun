name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  backend-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./tesis-gestkrun-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"
      - run: pip install ruff
      - run: ruff check app/

  backend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./tesis-gestkrun-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"
      - run: pip install poetry
      - run: poetry install
      - run: poetry run pytest tests/ --cov=app --cov-report=term --cov-fail-under=85

  frontend-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./tesis-gestkrun-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps
      - run: npx eslint src/

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./tesis-gestkrun-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps
      - run: npx tsc --noEmit
      - run: npm run build

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bandit scan (backend)
        run: |
          pip install bandit
          bandit -r tesis-gestkrun-api/app/ -f json -o bandit-report.json || true
      - name: npm audit (frontend)
        run: |
          cd tesis-gestkrun-web
          npm audit --audit-level=high || true
